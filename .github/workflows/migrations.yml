name: Migrations

on:
    pull_request:
        branches: [main]
        paths:
            - "database/migrations/**"
            - ".sequelizerc"
            - "configurations/database.config.cjs"
            - ".github/workflows/migrations.yml"
    workflow_dispatch:
    workflow_call:

permissions:
    contents: read

# Prefixed: under workflow_call, workflow_ref is the caller's, shared with ci.yml
concurrency:
    group: migrations-${{ github.workflow_ref }}
    cancel-in-progress: true

jobs:
    migrate:
        name: Migration Chain
        runs-on: ubuntu-latest
        timeout-minutes: 10
        services:
            postgres:
                # Matches compose.yaml so the chain is verified on the production engine
                image: postgres:latest
                env:
                    POSTGRES_USER: migrations
                    POSTGRES_PASSWORD: migrations
                    POSTGRES_DB: migrations
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U migrations"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        env:
            NODE_ENV: production
            POSTGRES_USER: migrations
            POSTGRES_PASSWORD: migrations
            POSTGRES_DB: migrations
            POSTGRES_HOST: localhost
            POSTGRES_PORT: 5432
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Run migrations against an empty database
              run: npm run db:migrate
